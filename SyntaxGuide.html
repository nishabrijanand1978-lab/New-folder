<!DOCTYPE html>
<html>
    <head>
        <title> 1st Webpage of JavaScript </title>

        <style>
            body {
                background-color: rgb(239, 145, 145);
            }

            h1 , p {
                color: lightblue;
                text-shadow: 2px 2px rgb(20, 123, 157);
            }

    <body>

        <h1 id="heading"></h1>
        <p id="paragraph"></p>

            document.getElementById("paragraph").innerHTML = "🎉My First Paragraph";
        </script>
    
</body>
</html>
