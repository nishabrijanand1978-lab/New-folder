<!DOCTYPE html>
<head>
    <title>JavaScript Statements</title>

    <style>
        body {
            background-color: rgb(229, 188, 111);
            text-align: center;
        }

        h2 , p {
            color: white;
            text-shadow: 3px 3px rgb(252, 164, 0);
        }
    </style>
</head>
<html>
<body>

<h2>JavaScript Statements</h2>

<p>A <b>JavaScript program</b> is a list of
<b>statements</b> to be executed by a computer.</p>

<p id="demo"></p>

<script>
var x, y, z; 
x = 5; 
y = 6; 
z = x + y; 

document.getElementById("demo").innerHTML = "The value of z is " + z + ".";

</script>

</body>
</html>
